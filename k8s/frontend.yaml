apiVersion: apps/v1
kind: Deployment # Deployment config
metadata:
  name: frontend-deployment # Name it
  labels:
    app: sdm-frontend # Apply app label

spec:
  replicas: 1 # One replica for local demo.
  selector:
    matchLabels:
      app: sdm-frontend # Match label

  template:
    metadata:
      labels:
        app: sdm-frontend # Apply label

    spec:
      containers: # Define container
        - name: frontend-container
          image: damienflutre/sdm-frontend:v1 # Get image we loaded via kind load-image
          
          resources:
            requests:
              cpu: "250m"      # Guaranteed minimum 0.25 CPU cores
              memory: "256Mi"  # Guaranteed minimum 256 Mebibytes
            limits:
              cpu: "500m"      # Maximum allowed CPU (will throttle if exceeded)
              memory: "512Mi"  # Hard memory cap (will OOM-kill if exceeded)
          
          ports: 
            - containerPort: 8080 # Set container port to 8080. Frontend pod is a web server; it expects requests.
          
          env: # Define environment variables. Moved from Dockerfile.
            - name: NGINX_PORT
              value: "8080"
            - name: API_HOST
              value: "api"
            - name: API_UPSTREAM_PORT
              value: "8080"
            - name: PROXY_READ_TIMEOUT
              value: 6000s

---

apiVersion: v1
kind: Service # Service config
metadata:
  name: frontend-service # Name service

spec:
  type: ClusterIP # Gives stable internal IP and DNS name in front of pods
  ports:
    - port: 3000 # Allow incoming on port 3000
      targetPort: 8080 # Route to 8080
  selector:
    app: sdm-frontend