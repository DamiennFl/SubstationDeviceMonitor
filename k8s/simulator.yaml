apiVersion: apps/v1
kind: Deployment # Deployment config
metadata:
  name: sim-deployment # Name it
  labels:
    app: backend-simulator # Define app label

spec:
  replicas: 1 # One replica since API contains static store, no DB
  selector:
    matchLabels:
      app: backend-simulator # Match label
  
  template:
    metadata:
      labels:
        app: backend-simulator # Match label
    
    spec:
      securityContext: # Use non-root user created in Dockerfile.simulator
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001

      containers: # Define container
        - name: sim-container
          image: damienflutre/sdm-sim:v1 # Get image we added via kind load-image
          resources:
            requests:
              cpu: "250m"      # Guaranteed minimum 0.25 CPU cores
              memory: "256Mi"  # Guaranteed minimum 256 Mebibytes
            limits:
              cpu: "500m"      # Maximum allowed CPU (will throttle if exceeded)
              memory: "512Mi"  # Hard memory cap (will OOM-kill if exceeded)
          env:
            - name: API_BASE_URL # Define API base URL for simulator to send GET and POST requests to.
              value: http://api:8080
  
# No service because Simulator is a client; does not expect any explicit inbound requests, only responses