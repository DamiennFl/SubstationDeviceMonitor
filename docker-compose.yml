# Define each container as service
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api # API dockerfile

  simulator:
    environment:
      - API_BASE_URL=http://api:8080
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator # Simulator dockerfile
    depends_on:
      - api # Depends on the API since it will try to sync with the Store on startup via GET
    restart: on-failure # Exits if its first sync beats the API's startup

  frontend:
    environment:
      - NGINX_PORT=8080
      - API_HOST=api
      - API_UPSTREAM_PORT=8080
      - PROXY_READ_TIMEOUT=6000s
    build:
      context: ./frontend/substation-device-monitoring
      dockerfile: Dockerfile # Frontend dockerfile
    ports:
      - '3000:8080' # App will be accessible on localhost:3000, route traffic to 8080 in network, which nginx is listening to
    depends_on:
      - api # frontend fails if it cannot connect to API (nginx cannot find upstream, throws error)