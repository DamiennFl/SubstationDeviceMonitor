# Define each container as service
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
  
  migrate:
    build:
      context: ./backend
      dockerfile: dockerfile.dbmigration
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api # API dockerfile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  simulator:
    environment:
      - API_BASE_URL=http://api:8080
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator # Simulator dockerfile
    depends_on:
      - api # Depends on the API since it will try to sync with the Store on startup via GET
    restart: on-failure # Exits if its first sync beats the API's startup

  frontend:
    environment:
      - NGINX_PORT=8080
      - API_HOST=api
      - API_UPSTREAM_PORT=8080
      - PROXY_READ_TIMEOUT=6000s
    build:
      context: ./frontend/substation-device-monitoring
      dockerfile: Dockerfile # Frontend dockerfile
    ports:
      - '3000:8080' # App will be accessible on localhost:3000, route traffic to 8080 in network, which nginx is listening to
    depends_on:
      - api # frontend fails if it cannot connect to API (nginx cannot find upstream, throws error)

volumes:
  pgdata: